<style>
  :root {
    --bg: #f5f3ec;
    --bg-elev: #ffffff;
    --ink: #1c211d;
    --ink-soft: #5b655e;
    --ink-faint: #8b9188;
    --turf: #2f6b45;
    --turf-strong: #1f4f33;
    --turf-tint: #e3ede3;
    --gold: #a9701b;
    --gold-tint: #f4e6cd;
    --line: #ddd7c7;
    --shadow: 0 1px 2px rgba(28, 33, 29, 0.06), 0 6px 16px -8px rgba(28, 33, 29, 0.18);
    --radius: 14px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --glow: rgba(47,107,69,.14);
    --hub-text: #f7fbf8;
    --n1: #2f6b45; --n2: #b9791f; --n3: #2b7a7a; --n4: #35588a; --n5: #8a3568;
    --node-text: #ffffff;
    --font-disp: "Quicksand", "Segoe UI", sans-serif;
    --R: clamp(94px, 34.5vw, 147px);
    --node: clamp(76px, 20.7vw, 94px);
    --hub: clamp(120px, 32.2vw, 163px);
    --dur: 76s;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101f16; --bg-elev: #16281c;
      --ink: #edf1ea; --ink-soft: #a9b6ab; --ink-faint: #728174;
      --turf: #74c493; --turf-strong: #8fd6ac; --turf-tint: #1c3526;
      --gold: #e3ab5c; --gold-tint: #3a2c14; --line: #24402f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -10px rgba(0, 0, 0, 0.5);
      --glow: rgba(116,196,147,.14);
      --hub-text: #0e130f;
      --n1: #4f9e6c; --n2: #d99a3e; --n3: #3fa0a0; --n4: #5478ad; --n5: #ad5085;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101f16; --bg-elev: #16281c;
    --ink: #edf1ea; --ink-soft: #a9b6ab; --ink-faint: #728174;
    --turf: #74c493; --turf-strong: #8fd6ac; --turf-tint: #1c3526;
    --gold: #e3ab5c; --gold-tint: #3a2c14; --line: #24402f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -10px rgba(0, 0, 0, 0.5);
    --glow: rgba(116,196,147,.14);
    --hub-text: #0e130f;
    --n1: #4f9e6c; --n2: #d99a3e; --n3: #3fa0a0; --n4: #5478ad; --n5: #ad5085;
  }
  :root[data-theme="light"] {
    --bg: #f5f3ec; --bg-elev: #ffffff;
    --ink: #1c211d; --ink-soft: #5b655e; --ink-faint: #8b9188;
    --turf: #2f6b45; --turf-strong: #1f4f33; --turf-tint: #e3ede3;
    --gold: #a9701b; --gold-tint: #f4e6cd; --line: #ddd7c7;
    --shadow: 0 1px 2px rgba(28, 33, 29, 0.06), 0 6px 16px -8px rgba(28, 33, 29, 0.18);
    --glow: rgba(47,107,69,.14);
    --hub-text: #f7fbf8;
    --n1: #2f6b45; --n2: #b9791f; --n3: #2b7a7a; --n4: #35588a; --n5: #8a3568;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); overflow-x: hidden; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.45;
    display: flex; justify-content: center;
  }
  a { text-decoration: none; color: inherit; }
  .app { width: 100%; max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .head { padding: calc(14px + var(--safe-t)) 18px 16px; background: linear-gradient(180deg, var(--turf-strong), var(--turf)); color: #f7fbf8; }
  .head__brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .head__text { min-width: 0; flex: 1; }
  .head__eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; opacity: .82; display: flex; align-items: center; gap: 8px; }
  .head__eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; }
  .head__title { margin: 4px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  .logo-row { flex: none; display: flex; align-items: center; gap: 8px; }
  .logo-badge {
    flex: none; width: 50px; height: 50px; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .logo-badge img { width: 100%; height: 100%; object-fit: contain; padding: 3px; box-sizing: border-box; }

  .top { padding: 14px 18px 2px; text-align: center; }
  .top__hint { margin: 0; font-size: 12.5px; color: var(--ink-soft); }

  .stage { position: relative; display: flex; justify-content: center; padding: 60px 10px 8px; background: radial-gradient(circle at 50% 30%, var(--glow), transparent 62%); }
  .orbit { position: relative; width: calc(2 * var(--R) + var(--node)); height: calc(2 * var(--R) + var(--node)); }
  .ring {
    position: absolute; top: 50%; left: 50%; width: calc(2 * var(--R)); height: calc(2 * var(--R));
    margin-left: calc(-1 * var(--R)); margin-top: calc(-1 * var(--R));
    border-radius: 50%; border: 1.5px solid var(--gold); opacity: .55; z-index: 1; pointer-events: none;
  }
  .hub {
    position: absolute; top: 50%; left: 50%; width: var(--hub); height: var(--hub);
    margin-left: calc(var(--hub) / -2); margin-top: calc(var(--hub) / -2); z-index: 2;
    border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, var(--turf), var(--turf-strong) 78%);
    color: var(--hub-text); box-shadow: 0 8px 26px rgba(0,0,0,.22);
    animation: breathe 5.5s ease-in-out infinite;
    cursor: pointer;
  }
  .hub.has-photo { background-image: var(--hub-photo); background-size: cover; background-position: center; }
  .hub.has-photo .hub__default { display: none; }
  .hub__default { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  .hub svg { width: 28px; height: 28px; }
  .hub b { font-family: var(--font-disp); font-weight: 700; font-size: clamp(13px, 3.4vw, 16px); }
  .hub span { font-size: 10px; opacity: .85; letter-spacing: .03em; }

  .hubmenu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .hubmenu-backdrop[hidden] { display: none; }
  .hubmenu { background: var(--bg-elev); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 7px; min-width: 230px; box-shadow: var(--shadow); }
  .hubmenu button { font: inherit; font-size: 14px; font-weight: 600; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; text-align: left; }
  .hubmenu button:hover { background: var(--turf-tint); }
  .hubmenu__cancel { opacity: .7; font-weight: 500; }

  .node {
    position: absolute; top: 50%; left: 50%; width: var(--node); height: var(--node);
    margin-left: calc(var(--node) / -2); margin-top: calc(var(--node) / -2); z-index: 3;
    touch-action: none; -webkit-user-select: none; user-select: none; cursor: grab;
    transform: rotate(var(--phase-deg)) translateY(calc(-1 * var(--R))) rotate(calc(var(--phase-deg) * -1));
  }
  .node:active { cursor: grabbing; }
  @media (prefers-reduced-motion: reduce) { .hub { animation: none; } }
  .node__bubble {
    width: 100%; height: 100%; border-radius: 50%; color: var(--node-text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    text-align: center; padding: 6px; box-shadow: 0 5px 14px rgba(0,0,0,.18);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .node:hover .node__bubble, .node:focus-visible .node__bubble { transform: scale(1.07); box-shadow: 0 8px 20px rgba(0,0,0,.26); }
  .node:active .node__bubble { transform: scale(.97); }
  .node__bubble svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .node__bubble b { font-family: var(--font-disp); font-weight: 600; font-size: 10.5px; line-height: 1.1; text-wrap: balance; }
  .node__bubble small { font-size: 8px; opacity: .85; font-weight: 600; letter-spacing: .02em; }
  #n1 .node__bubble { background: var(--n1); }
  #n2 .node__bubble { background: var(--n2); }
  #n3 .node__bubble { background: var(--n3); }
  #n4 .node__bubble { background: var(--n4); }
  #n5 .node__bubble { background: var(--n5); }
  .node.soon .node__bubble { opacity: .78; }

  footer { margin-top: 130px; padding: 14px 18px calc(18px + var(--safe-b)); font-size: 11.5px; color: var(--ink-faint); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var orbit = document.querySelector(".orbit");
  if (!orbit) return;
  var BASE_SPEED = 360 / 76;
  var MAX_SPEED = BASE_SPEED * 50;
  var MIN_SPEED = BASE_SPEED * 3;
  var DECAY_TAU = 2.5;
  var PUSH_FACTOR = 2.4;
  var DRAG_THRESHOLD = 10;

  var speed = BASE_SPEED;

  var nodes = Array.prototype.slice.call(orbit.querySelectorAll(".node")).map(function (el) {
    var deg = parseFloat(getComputedStyle(el).getPropertyValue("--phase-deg")) || 0;
    return { el: el, angle: deg };
  });

  function applyTransform(n) {
    n.el.style.transform = "rotate(" + n.angle + "deg) translateY(calc(-1 * var(--R))) rotate(" + (-n.angle) + "deg)";
  }
  nodes.forEach(applyTransform);
  if (reduce) return;

  var last = null;
  function tick(now) {
    if (last == null) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (Math.abs(speed) > MIN_SPEED) {
      var floor = (speed < 0 ? -1 : 1) * MIN_SPEED;
      speed = floor + (speed - floor) * Math.exp(-dt / DECAY_TAU);
    }
    nodes.forEach(function (n) {
      n.angle = (n.angle + speed * dt) % 360;
      if (n.angle < 0) n.angle += 360;
      applyTransform(n);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  nodes.forEach(function (n) {
    var start = null, moved = false;
    n.el.addEventListener("pointerdown", function (e) {
      start = { x: e.clientX, y: e.clientY };
      moved = false;
      try { n.el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    n.el.addEventListener("pointermove", function (e) {
      if (!start) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.hypot(dx, dy) > DRAG_THRESHOLD) moved = true;
    });
    n.el.addEventListener("pointerup", function (e) {
      if (start && moved) {
        var dx = e.clientX - start.x, dy = e.clientY - start.y;
        var len = Math.hypot(dx, dy) || 1;
        var dragX = dx / len, dragY = dy / len;
        var rad = n.angle * Math.PI / 180;
        var tx = Math.cos(rad), ty = Math.sin(rad);
        var dirSign = speed < 0 ? -1 : 1;
        var dot = (dragX * tx + dragY * ty) * dirSign;
        if (dot >= 0) {
          speed = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, speed * PUSH_FACTOR));
        } else {
          speed = -speed;
        }
      }
      start = null;
    });
    n.el.addEventListener("click", function (e) {
      if (moved) { e.preventDefault(); moved = false; }
    });
  });
})();
</script>
<script>
(function () {
  "use strict";
  var STORAGE_KEY = "borgofiumi-hub-photo";
  var PHOTO_SIZE = 480;
  var hub = document.getElementById("hub");
  var backdrop = document.getElementById("hubmenu-backdrop");
  var removeBtn = document.getElementById("hubmenu-remove");
  var uploadInput = document.getElementById("hub-upload-input");
  var cameraInput = document.getElementById("hub-camera-input");
  if (!hub || !backdrop) return;

  function setPhoto(dataUrl) {
    hub.style.setProperty("--hub-photo", 'url("' + dataUrl + '")');
    hub.classList.add("has-photo");
    if (removeBtn) removeBtn.hidden = false;
  }
  function clearPhoto() {
    hub.classList.remove("has-photo");
    hub.style.removeProperty("--hub-photo");
    if (removeBtn) removeBtn.hidden = true;
    try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
  }
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) setPhoto(saved);
  } catch (err) {}

  function openMenu() { backdrop.hidden = false; }
  function closeMenu() { backdrop.hidden = true; }

  hub.addEventListener("dblclick", function (e) {
    e.preventDefault();
    openMenu();
  });
  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) closeMenu();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !backdrop.hidden) closeMenu();
  });
  backdrop.querySelectorAll("button[data-action]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var action = btn.getAttribute("data-action");
      if (action === "camera" && cameraInput) cameraInput.click();
      else if (action === "upload" && uploadInput) uploadInput.click();
      else if (action === "remove") clearPhoto();
      closeMenu();
    });
  });

  function resizeAndStore(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var side = Math.min(img.naturalWidth, img.naturalHeight);
        var sx = (img.naturalWidth - side) / 2;
        var sy = (img.naturalHeight - side) / 2;
        var canvas = document.createElement("canvas");
        canvas.width = PHOTO_SIZE;
        canvas.height = PHOTO_SIZE;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, side, side, 0, 0, PHOTO_SIZE, PHOTO_SIZE);
        var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        try { localStorage.setItem(STORAGE_KEY, dataUrl); } catch (err) {}
        setPhoto(dataUrl);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  [uploadInput, cameraInput].forEach(function (input) {
    if (!input) return;
    input.addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      if (file) resizeAndStore(file);
      e.target.value = "";
    });
  });
})();
</script>
