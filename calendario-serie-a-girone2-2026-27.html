<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendario Serie A 2026/27 — Girone 2 Territoriale</title>
<style>
  :root {
    --bg: #f5f3ec;
    --bg-elev: #ffffff;
    --bg-sunk: #ece8db;
    --ink: #1c211d;
    --ink-soft: #5b655e;
    --ink-faint: #8b9188;
    --turf: #2f6b45;
    --turf-strong: #1f4f33;
    --turf-tint: #e3ede3;
    --gold: #a9701b;
    --gold-tint: #f4e6cd;
    --line: #ddd7c7;
    --shadow: 0 1px 2px rgba(28, 33, 29, 0.06), 0 6px 16px -8px rgba(28, 33, 29, 0.18);
    --radius: 14px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101f16;
      --bg-elev: #16281c;
      --bg-sunk: #0c1710;
      --ink: #edf1ea;
      --ink-soft: #a9b6ab;
      --ink-faint: #728174;
      --turf: #74c493;
      --turf-strong: #8fd6ac;
      --turf-tint: #1c3526;
      --gold: #e3ab5c;
      --gold-tint: #3a2c14;
      --line: #24402f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -10px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #101f16;
    --bg-elev: #16281c;
    --bg-sunk: #0c1710;
    --ink: #edf1ea;
    --ink-soft: #a9b6ab;
    --ink-faint: #728174;
    --turf: #74c493;
    --turf-strong: #8fd6ac;
    --turf-tint: #1c3526;
    --gold: #e3ab5c;
    --gold-tint: #3a2c14;
    --line: #24402f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -10px rgba(0, 0, 0, 0.5);
  }

  :root[data-theme="light"] {
    --bg: #f5f3ec;
    --bg-elev: #ffffff;
    --bg-sunk: #ece8db;
    --ink: #1c211d;
    --ink-soft: #5b655e;
    --ink-faint: #8b9188;
    --turf: #2f6b45;
    --turf-strong: #1f4f33;
    --turf-tint: #e3ede3;
    --gold: #a9701b;
    --gold-tint: #f4e6cd;
    --line: #ddd7c7;
    --shadow: 0 1px 2px rgba(28, 33, 29, 0.06), 0 6px 16px -8px rgba(28, 33, 29, 0.18);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
  }

  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- Header ---- */
  .head {
    padding: calc(18px + var(--safe-t)) 18px 14px;
    background: linear-gradient(180deg, var(--turf-strong), var(--turf));
    color: #f7fbf8;
  }
  .head__eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    opacity: 0.82;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .head__eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.6; }
  .head__title {
    margin: 4px 0 0;
    font-size: 24px;
    font-weight: 800;
    font-stretch: condensed;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .head__sub {
    margin: 3px 0 0;
    font-size: 13px;
    color: rgba(247, 251, 248, 0.78);
  }

  /* ---- Tabs ---- */
  .tabs {
    margin: 14px 18px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: rgba(0, 0, 0, 0.16);
    border-radius: 11px;
    padding: 3px;
    gap: 3px;
  }
  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: rgba(247, 251, 248, 0.75);
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 9px 6px;
    border-radius: 8px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] {
    background: var(--bg-elev);
    color: var(--turf-strong);
    box-shadow: var(--shadow);
  }

  /* ---- Sticky filter bar ---- */
  .filterbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0 10px;
  }
  .chiprow {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 0 18px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    appearance: none;
    flex: 0 0 auto;
    scroll-snap-align: start;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    color: var(--ink-soft);
    font: inherit;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.15;
    min-height: 44px;
    justify-content: center;
  }
  .chip small {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-top: 1px;
  }
  .chip[aria-pressed="true"] {
    background: var(--turf);
    border-color: var(--turf);
    color: #f7fbf8;
  }
  .chip[aria-pressed="true"] small { color: rgba(247, 251, 248, 0.75); }
  .chip:focus-visible { outline: 2px solid var(--turf-strong); outline-offset: 2px; }

  /* ---- Stat strip ---- */
  .statline {
    padding: 12px 18px 2px;
    font-size: 12.5px;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .statline strong { color: var(--ink-soft); font-weight: 700; }
  .statline .split { display: flex; gap: 10px; }
  .statline .split b { color: var(--turf-strong); font-variant-numeric: tabular-nums; }
  .statline .split .away b { color: var(--ink-soft); }

  /* ---- List ---- */
  .list {
    flex: 1;
    padding: 8px 18px calc(28px + var(--safe-b));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .group-head {
    margin-top: 10px;
    padding: 2px 2px 0;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--turf-strong);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-head::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 13px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .card.is-home { border-left-color: var(--gold); }

  .card__meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .card__meta .when { font-variant-numeric: tabular-nums; }
  .badge {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: var(--gold);
    background: var(--gold-tint);
    padding: 3px 7px;
    border-radius: 999px;
  }

  .card__match {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 15.5px;
    font-weight: 700;
    text-wrap: balance;
  }
  .card__match .sep { color: var(--ink-faint); font-weight: 400; }
  .card__match .hi { color: var(--turf-strong); }

  .card__foot {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .card__foot svg { width: 12px; height: 12px; flex: none; opacity: 0.7; }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-faint);
    font-size: 13.5px;
  }

  .foot-note {
    padding: 4px 18px calc(20px + var(--safe-b));
    font-size: 11.5px;
    color: var(--ink-faint);
    text-align: center;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { transition: transform 120ms ease; }
    .chip { transition: background 120ms ease, color 120ms ease; }
  }

  /* ---- Brand / logo ---- */
  .head__brand { display: flex; align-items: center; gap: 12px; }
  .logo-badge {
    flex: none; width: 63px; height: 63px; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .logo-badge img { width: 100%; height: 100%; object-fit: contain; padding: 4px; box-sizing: border-box; }
  .head__text { min-width: 0; flex: 1; }

  /* ---- Venue card ---- */
  .venue { padding: 10px 18px 0; }
  .venue[hidden] { display: none; }
  .venue-card {
    display: flex; align-items: center; gap: 10px;
    background: var(--gold-tint);
    border: 1px solid var(--gold);
    border-radius: 12px; padding: 10px 12px;
  }
  .venue-icon { flex: none; width: 20px; height: 20px; color: var(--gold); }
  .venue-icon svg { width: 100%; height: 100%; }
  .venue-body { flex: 1; min-width: 0; }
  .venue-name { font-weight: 800; font-size: 13.5px; color: var(--ink); }
  .venue-addr { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .venue-link {
    flex: none; font-size: 11.5px; font-weight: 700; color: var(--gold);
    text-decoration: none; border: 1px solid var(--gold);
    padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  }
  .venue-link:hover, .venue-link:focus-visible { background: var(--gold); color: #1c211d; outline: none; }
</style>
</head>

  // Campo + via per ciascuna squadra (fonte: siti ufficiali societa, ricerca 2026-08-10)

    "Amatori & Union Rugby Milano": { name: "Campo Crespi", street: "Via Carlo Valvassori Peroni, 48" },
    "Modena Rugby 1965": { name: "Stadio Comunale del Rugby \"Luciano Zanetti\"", street: "Strada Collegarola, 80/B" },
    "Brixia": { name: "Stadio Aldo Invernici", street: "Via della Maggia, 18" },
    "Rugby Lecco": { name: "Centro Sportivo Comunale \"Al Bione\"", street: "Via Buoni Lazzaro" },
    "Rugby Bergamo 1950": { name: "Stadio Sghirlanzoni (Cittadella dello Sport)", street: "Via Pizzo della Presolana, 2" },
    "Unione Monferrato Rugby": { name: "Cittadella del Rugby di Asti", street: "Via Francesco Cirio, 27" },
    "Rugby Milano": { name: "Centro Sportivo \"G. Curioni\" (Idroscalo)", street: "Via Circonvallazione Idroscalo" },

    "Verona Rugby": { name: "CUS Verona Park", street: "Via della Diga, 6" },
    "Stade Valdotain Rugby": { name: "Campo Sportivo Comunale di Sarre", street: "Localita Area6 Tu" }
  };

  function gid(g) { return g.round + g.n; }

  // ---- derive Bergamo-only fixture list from the single source of truth ----
  var BERGAMO = [];
  GIORNATE.forEach(function (g) {
    g.m.forEach(function (m) {
      if (m[0] === HIGHLIGHT || m[1] === HIGHLIGHT) {
        BERGAMO.push({
          round: g.round, n: g.n, date: g.date,
          home: m[0] === HIGHLIGHT,
          opponent: m[0] === HIGHLIGHT ? m[1] : m[0],
          time: m[2], sede: m[3]
        });
      }
    });
  });

  var PILL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c-3-3-3-15 0-18M12 3c3 3 3 15 0 18M4 12h16" stroke-linecap="round"/></svg>';

  var state = { tab: "ber", giornata: null };

  var chiprowEl = document.getElementById("chiprow");
  var listEl = document.getElementById("list");
  var statlineEl = document.getElementById("statline");
  var tabBer = document.getElementById("tab-ber");
  var tabG2 = document.getElementById("tab-g2");
  var venueEl = document.getElementById("venue");

  function buildChips() {
    var html = '<button class="chip" data-g="" aria-pressed="' + (state.giornata === null) + '">Tutte</button>';
    GIORNATE.forEach(function (g) {
      var id = gid(g);
      var label = (g.round === "A" ? "A" : "R") + g.n;
      html += '<button class="chip" data-g="' + id + '" aria-pressed="' + (state.giornata === id) + '">' +
        label + '<small>' + fmtShort(g.date) + '</small></button>';
    });
    chiprowEl.innerHTML = html;
  }

  function cardHtml(opts) {
    var meta = (opts.round === "A" ? "Andata" : "Ritorno") + " &middot; G" + opts.n + " &middot; " + fmtFull(opts.date).replace(/^\w/, function (c) { return c.toUpperCase(); });
    var home = opts.home, away = opts.away;
    var homeCls = home === HIGHLIGHT ? "hi" : "";
    var awayCls = away === HIGHLIGHT ? "hi" : "";
    var isHome = home === HIGHLIGHT;
    var isAway = away === HIGHLIGHT;
    var cardCls = (isHome ? " is-home" : "");
    var badge = isHome ? '<span class="badge">CASA</span>' : (isAway ? '<span class="badge" style="color:var(--ink-soft);background:var(--bg-sunk);">TRASFERTA</span>' : "");
    return (
      '<div class="card' + cardCls + '">' +
        '<div class="card__meta"><span class="when">' + opts.time + '</span>' + badge + '</div>' +
        '<div class="card__meta" style="margin-top:-4px;margin-bottom:8px;font-weight:600;color:var(--ink-faint);text-transform:none;letter-spacing:0;">' + meta + '</div>' +
        '<div class="card__match"><span class="' + homeCls + '">' + home + '</span><span class="sep">&ndash;</span><span class="' + awayCls + '">' + away + '</span></div>' +
        '<div class="card__foot">' + PILL_ICON + '<span>' + opts.sede + '</span></div>' +
      '</div>'
    );
  }

  function renderBergamo() {
    var items = BERGAMO.slice();
    if (state.giornata) items = items.filter(function (m) { return (m.round + m.n) === state.giornata; });

    var home = BERGAMO.filter(function (m) { return m.home; }).length;
    var away = BERGAMO.length - home;
    statlineEl.innerHTML =
      '<span><strong>' + items.length + '</strong> partit' + (items.length === 1 ? "a" : "e") + '</span>' +
      '<span class="split"><span>Casa <b>' + home + '</b></span><span class="away">Trasferta <b>' + away + '</b></span></span>';

    if (!items.length) { listEl.innerHTML = '<p class="empty">Nessuna partita per questa giornata.</p>'; return; }

    listEl.innerHTML = items.map(function (m) {
      var h = m.home ? HIGHLIGHT : m.opponent;
      var a = m.home ? m.opponent : HIGHLIGHT;
      return cardHtml({ round: m.round, n: m.n, date: m.date, time: m.time, sede: m.sede, home: h, away: a });
    }).join("");
  }

  function renderGirone2() {
    var giornate = GIORNATE.slice();
    if (state.giornata) giornate = giornate.filter(function (g) { return gid(g) === state.giornata; });

    var totalMatches = giornate.reduce(function (n, g) { return n + g.m.length; }, 0);
    statlineEl.innerHTML =
      '<span><strong>' + totalMatches + '</strong> partit' + (totalMatches === 1 ? "a" : "e") + '</span>' +
      '<span class="split"><span>' + giornate.length + ' giornat' + (giornate.length === 1 ? "a" : "e") + '</span></span>';

    if (!giornate.length) { listEl.innerHTML = '<p class="empty">Nessuna giornata selezionata.</p>'; return; }

    var html = "";
    giornate.forEach(function (g) {
      if (!state.giornata) {
        html += '<div class="group-head">' + (g.round === "A" ? "Andata" : "Ritorno") + ' &middot; Giornata ' + g.n + ' &middot; ' + fmtShort(g.date) + '</div>';
      }
      g.m.forEach(function (m) {
        html += cardHtml({ round: g.round, n: g.n, date: g.date, time: m[2], sede: m[3], home: m[0], away: m[1] });
      });
    });
    listEl.innerHTML = html;
  }

  var PIN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12Z" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.4"/></svg>';

  function renderVenue() {
    if (state.tab !== "ber" || !state.giornata) { venueEl.hidden = true; venueEl.innerHTML = ""; return; }
    var m = BERGAMO.find(function (x) { return (x.round + x.n) === state.giornata; });
    if (!m) { venueEl.hidden = true; venueEl.innerHTML = ""; return; }
    var hostTeam = m.home ? HIGHLIGHT : m.opponent;
    var v = TEAM_VENUES[hostTeam];
    if (!v) { venueEl.hidden = true; venueEl.innerHTML = ""; return; }
    var addr = v.street + " &middot; " + m.sede;
    var mapsQuery = encodeURIComponent(v.name.replace(/"/g, "") + ", " + v.street + ", " + m.sede);
    venueEl.hidden = false;
    venueEl.innerHTML =
      '<div class="venue-card">' +
        '<div class="venue-icon">' + PIN_ICON + '</div>' +
        '<div class="venue-body">' +
          '<div class="venue-name">' + v.name + '</div>' +
          '<div class="venue-addr">' + addr + '</div>' +
        '</div>' +
        '<a class="venue-link" href="https://www.google.com/maps/search/?api=1&query=' + mapsQuery + '" target="_blank" rel="noopener">Apri in Maps</a>' +
      '</div>';
  }

  function render() {
    renderVenue();
    buildChips();
    if (state.tab === "ber") renderBergamo(); else renderGirone2();
  }

  chiprowEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    state.giornata = btn.getAttribute("data-g") || null;
    render();
  });

  tabBer.addEventListener("click", function () {
    state.tab = "ber";
    tabBer.setAttribute("aria-selected", "true");
    tabG2.setAttribute("aria-selected", "false");
    render();
  });
  tabG2.addEventListener("click", function () {
    state.tab = "g2";
    tabG2.setAttribute("aria-selected", "true");
    tabBer.setAttribute("aria-selected", "false");
    render();
  });

  render();
})();
